spring.datasource.url=jdbc:mysql://localhost:3306/proyecto_final
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
server.error.include-message=always

# Seguridad JWT. En un despliegue real, sobreescribir JWT_SECRET y N8N_API_KEY
# como variables de entorno del sistema (no commitear valores reales).
jwt.secret=${JWT_SECRET:dev-only-change-me-min-32-characters-long}
jwt.expiration-minutes=60
n8n.api.key=${N8N_API_KEY:dev-only-change-me}