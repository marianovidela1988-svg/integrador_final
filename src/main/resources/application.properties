# Perfil activo por defecto: "dev" (ver application-dev.properties), que trae
# valores por defecto inseguros pensados solo para desarrollo local. Cualquier
# otro perfil (por ejemplo "prod", activado con SPRING_PROFILES_ACTIVE=prod)
# usa este archivo junto con su propio application-<perfil>.properties (ver
# application-prod.properties), donde las credenciales y secretos no tienen
# valor por defecto: si no se proveen por variable de entorno, el arranque
# falla con un error de placeholder no resuelto en lugar de arrancar con un
# secreto débil o una base de datos sin contraseña.
spring.profiles.active=dev

# ddl-auto=update es deliberado solo para "dev": permite que Hibernate
# mantenga el esquema al día mientras el modelo todavia cambia. En "prod"
# (application-prod.properties) se sobreescribe a "validate", para que un
# despliegue real nunca altere el esquema de forma automatica.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
server.error.include-message=always

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60
n8n.api.key=${N8N_API_KEY}

# La cookie de sesión JWT solo debe viajar por HTTPS en un despliegue real;
# en desarrollo local (HTTP) debe quedar en false o el navegador la descarta.
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
