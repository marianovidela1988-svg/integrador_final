# Valores por defecto para desarrollo local (XAMPP/MySQL sin contraseña, bot
# de Telegram vía n8n en la misma máquina). Este perfil está activo por
# defecto (ver spring.profiles.active en application.properties); NO se debe
# usar en un despliegue real. Sobreescriben, uno a uno, los placeholders sin
# valor por defecto del archivo base.
spring.datasource.url=jdbc:mysql://localhost:3306/proyecto_final
spring.datasource.username=root
spring.datasource.password=

jwt.secret=dev-only-change-me-min-32-characters-long
n8n.api.key=dev-only-change-me

# Mensaje de las excepciones no controladas visible en desarrollo (en el archivo
# base queda en "never" para cualquier otro perfil).
server.error.include-message=always
