# Se activa con SPRING_PROFILES_ACTIVE=prod. Sobreescribe, sobre el archivo
# base (application.properties), lo que en "dev" es conveniente pero no es
# seguro en un despliegue real.
#
# ddl-auto=validate: Hibernate compara las entidades contra el esquema
# existente y falla el arranque si no coinciden, pero nunca crea, altera
# ni borra tablas o columnas por su cuenta. El esquema de un despliegue real
# se gestiona explícitamente (por ejemplo, aplicando docs/analisis/schema.sql
# o una migración versionada), nunca de forma automática al iniciar la app.
spring.jpa.hibernate.ddl-auto=validate
